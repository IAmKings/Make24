# Release 工作流：推送 v* 标签或手动触发时，编译 release APK 并发布 GitHub Release
#
# 触发方式：
#   1) git tag v1.0.0 && git push origin v1.0.0   —— 自动构建并发布 Release
#   2) 在 Actions 页面手动 Run workflow           —— 仅构建并上传 artifact（无 tag，不发布）
#
# 签名：release 构建使用 debug 密钥签名（见 app/build.gradle.kts），保证 APK 可直接安装；
#       正式发布请在 signingConfigs 配置正式 keystore 或改用 secrets 注入。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 与上传资源

jobs:
  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 发布 GitHub Release（仅 tag 推送触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
