<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 432 432" fill="none">
  <title>Arithmetickle failed attempt adaptive icon</title>
  <desc>Failed reward state with a cracked golden star, falling fragments and a coral error mark.</desc>
  <defs>
    <radialGradient id="sun" cx="42%" cy="35%" r="70%"><stop stop-color="#FFC794"/><stop offset=".48" stop-color="#FFB52E"/><stop offset="1" stop-color="#F59B16"/></radialGradient>
    <linearGradient id="goldMuted" x1="120" y1="92" x2="305" y2="304" gradientUnits="userSpaceOnUse"><stop stop-color="#FFE79A"/><stop offset=".42" stop-color="#E9A31B"/><stop offset="1" stop-color="#9C5C12"/></linearGradient>
    <linearGradient id="pedestal" x1="155" y1="288" x2="278" y2="342" gradientUnits="userSpaceOnUse"><stop stop-color="#4D515B"/><stop offset="1" stop-color="#20242B"/></linearGradient>
    <filter id="shadow" x="80" y="285" width="280" height="90" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="432" height="432" fill="#0058BB"/>
  <circle cx="216" cy="216" r="184" fill="url(#sun)"/>
  <circle cx="216" cy="216" r="184" fill="#884D00" opacity=".08"/>
  <ellipse cx="216" cy="341" rx="113" ry="16" fill="#884D00" opacity=".3" filter="url(#shadow)"/>

  <!-- Dimmed celebration accents -->
  <g stroke-linecap="round" stroke-width="5" opacity=".78">
    <path d="M142 92c18 12 3 23 15 34s-5 22-1 30" stroke="#FFF1A6"/>
    <path d="M287 114c-12 10-23 0-28 16s-13 11-16 26" stroke="#0058BB"/>
    <path d="M320 249c-17 12-2 25-14 37s-5 19-3 27" stroke="#E83D83"/>
    <path d="M125 259c15 8 4 20-5 25s-2 19-14 24" stroke="#E83D83"/>
  </g>
  <g opacity=".72"><path d="m87 171 18-5 8 19-17 13z" fill="#0058BB"/><path d="m326 188 17 10-5 20-18-9z" fill="#0058BB"/><circle cx="108" cy="137" r="4" fill="#FECB00"/><circle cx="292" cy="158" r="4" fill="#FECB00"/></g>

  <!-- Cracked, slightly tilted reward star -->
  <g transform="rotate(7 216 207)">
    <path d="m216 111 27 61 67 6-51 44 16 65-59-35-59 35 16-65-51-44 67-6 27-61Z" fill="url(#goldMuted)" stroke="#884D00" stroke-width="5" stroke-linejoin="round"/>
    <path d="m216 126 20 58 61 6-47 37 14 48-48-29z" fill="#FFEAA2" opacity=".58"/>
    <path d="m216 126v120l-43 29 16-54-43-37 58-5z" fill="#FFFBE0" opacity=".42"/>
    <!-- prominent failure crack -->
    <path d="M215 118 207 166l14 28-18 25 14 18-10 30" stroke="#884D00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M207 166 188 185l21 9" stroke="#FFF1A6" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Broken stem and displaced pedestal -->
  <path d="M191 277h48l10 25-23 9h-47z" fill="#C47A17" stroke="#884D00" stroke-width="4"/>
  <path d="M181 304h55l15 14h-79z" fill="#E9A31B" stroke="#884D00" stroke-width="4" stroke-linejoin="round"/>
  <path d="M158 323h116v25H158z" fill="url(#pedestal)"/>
  <path d="M158 323h116" stroke="#20242B" stroke-width="4"/>
  <path d="m145 347 24-11 15 11-20 12z" fill="#20242B"/>
  <path d="m283 347 22-8 12 13-27 9z" fill="#20242B"/>

  <!-- Error mark -->
  <circle cx="315" cy="111" r="42" fill="#E83D83"/>
  <path d="m297 93 36 36M333 93l-36 36" stroke="#FFFBE0" stroke-width="10" stroke-linecap="round"/>
  <circle cx="315" cy="111" r="42" stroke="#FECB00" stroke-width="5" opacity=".8"/>

  <!-- Falling star fragment -->
  <path d="m121 315 20 5-10 19-17-10z" fill="#E83D83"/>
  <path d="m294 302 12 10-9 14-13-9z" fill="#FECB00"/>
</svg>
