  <path d="m216 126 20 58 61 6-47 37 14 48-48-29z" fill="#FFF5B4" opacity=".9"/>
  <path d="m216 126v120l-43 29 16-54-43-37 58-5z" fill="#FFFBE0" opacity=".85"/>
  <path d="m216 246 59 35-59-14z" fill="#C96E00" opacity=".78"/>
  <path d="m216 246-43 29 43-14z" fill="#F4A700" opacity=".95"/>

  <!-- Trophy stem and pedestal -->
