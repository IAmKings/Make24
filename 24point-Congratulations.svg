  <path d="M176 307h80l18 18H158z" fill="#FECB00" stroke="#884D00" stroke-width="4" stroke-linejoin="round"/>
  <path d="M158 325h116v25H158z" fill="url(#pedestal)"/>
  <path d="M158 325h116" stroke="#20242B" stroke-width="4"/>
  <path d="M173 329h86v4h-86z" fill="#6C9FFF" opacity=".5"/>
